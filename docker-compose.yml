version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"  # Vite default port for development
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: proj/Dockerfile
    volumes:
      - ./proj:/app
    ports:
      - "8000:8000"  # FastAPI default port for development
    environment:
      - PYTHONUNBUFFERED=1

