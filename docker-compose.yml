version: "3.8"

services:
  backend:
    build:
      context: ./proj  # Path to the backend directory
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./proj:/app  # Mount the backend code for easy development
    environment:
      - ENV_VAR=value  # Add any necessary environment variables for the backend

  frontend:
    build:
      context: ./client  # Path to the frontend directory
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app  # Mount the frontend code for easy development
    environment:
      - ENV_VAR=value  # Add any necessary environment variables for the frontend
    depends_on:
      - backend  # Ensure backend is ready before starting frontend

